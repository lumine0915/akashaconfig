# 虚空终端配置 by Lumine
# 请在 proxy-providers 中添加订阅链接, 或在 proxies 中添加自定义节点

# 锚点
a_provider: &a_provider {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 300}, exclude-type: 'direct|reject|rematch', exclude-filter: '(?i)(群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|电报|频道|无法|说明|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|优惠|福利|邀请|好友|失联|选择|剩余|公益|发布|DIZTNA|通路|登录|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|过滤|⚠️|@|t\.me\/\+|\bexpire\b|\bhttps?:\/\/|\.com|\btraffic\b)'}
a_url-test: &a_url-test {type: url-test, include-all: true, url: 'https://www.gstatic.com/generate_204', interval: 300, tolerance: 50, empty-fallback: REJECT, hidden: true, lazy: true}
a_select: &a_select {type: select, include-all: true, exclude-type: 'direct', empty-fallback: REJECT}

a_base: &a_base [日本节点, 狮城节点, 美国节点, 台湾节点, 香港节点, 全球手动, DIRECT]
a_oversea: &a_oversea [默认代理, 日本节点, 狮城节点, 美国节点, 台湾节点, 香港节点, 全球手动, DIRECT]

a_defaultDNS: &a_defaultDNS ['119.29.29.29', '223.5.5.5']
a_chinaDNS: &a_chinaDNS ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
a_foreignDNS: &a_foreignDNS ['https://cloudflare-dns.com/dns-query#默认代理', 'https://dns.google/dns-query#默认代理']

# 代理订阅
# 添加多个订阅请确保名称不要重复, 并修改 additional-prefix 以确保节点不重名
proxy-providers:
  Provider1:
    <<: *a_provider
    url: "ProviderURL"
    override:
      additional-prefix: '[P1] '

  # 以下是第二个订阅的示例
  # Provider2:
  #   <<: *a_provider
  #   url: "ProviderURL"
  #   override:
  #     additional-prefix: '[P2] '

# 自定义代理节点
proxies:
  # 以下是示例
  # - name: "ss1"
  #   type: ss
  #   server: server
  #   port: 443
  #   cipher: aes-128-gcm
  #   password: password

# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板
external-controller: 127.0.0.1:9090
secret: ""
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

# 嗅探
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mips
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain"
    - "rule-set:fakeip-filter"
    - "rule-set:cn_domain"
    - "rule-set:microsoftcn_domain"
    - "rule-set:applecn_domain"
    - "rule-set:steamcn_domain"
  default-nameserver: *a_defaultDNS
  nameserver-policy:
    'rule-set:private_domain': 'system'
    'rule-set:cn_domain': *a_chinaDNS
    'rule-set:microsoftcn_domain': *a_chinaDNS
    'rule-set:applecn_domain': *a_chinaDNS
    'rule-set:steamcn_domain': *a_chinaDNS
  nameserver: *a_foreignDNS
  proxy-server-nameserver: *a_chinaDNS
  direct-nameserver: *a_chinaDNS
  direct-nameserver-follow-policy: true

hosts:
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'cloudflare-dns.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']

  # 解决谷歌商店无法下载的问题
  'services.googleapis.cn': 'services.googleapis.com'

# 出站策略
proxy-groups:
  - {name: 默认代理, type: select, proxies: *a_base}
  - {name: YouTube, type: select, default-selected: '美国节点', proxies: *a_oversea}
  - {name: Google, type: select, proxies: *a_oversea}
  - {name: AI, type: select, default-selected: '美国节点', proxies: *a_oversea}
  - {name: GitHub, type: select, proxies: *a_oversea}
  - {name: OneDrive, type: select, proxies: *a_oversea}
  - {name: Microsoft, type: select, proxies: *a_oversea}
  - {name: Apple, type: select, proxies: *a_oversea}
  - {name: Steam, type: select, proxies: *a_oversea}
  - {name: TikTok, type: select, proxies: *a_oversea}
  - {name: Telegram, type: select, default-selected: '狮城节点', proxies: *a_oversea}
  - {name: NETFLIX, type: select, default-selected: '狮城节点', proxies: *a_oversea}
  - {name: Wallet, type: select, default-selected: '全球手动', proxies: *a_oversea}
  - {name: 漏网之鱼, type: select, proxies: *a_oversea}

  # 以下是地区分组。如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
  - {name: 香港节点, <<: *a_url-test, filter: "(?i)(港|hk|hongkong|hong kong)"}
  - {name: 台湾节点, <<: *a_url-test, filter: "(?i)(台|tw|taiwan)"}
  - {name: 日本节点, <<: *a_url-test, filter: "(?i)(日|jp|japan)"}
  - {name: 狮城节点, <<: *a_url-test, filter: "(?i)(新|sg|singapore)"}
  - {name: 美国节点, <<: *a_url-test, filter: "(?i)(美|us|unitedstates|united states)"}
  - {name: 全球手动, <<: *a_select}

# 规则匹配
rules:
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT

  - RULE-SET,ai_domain,AI
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,github_domain,GitHub
  - RULE-SET,onedrive_domain,OneDrive
  - RULE-SET,microsoftcn_domain,DIRECT
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,apple_domain,Apple
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,paypal_domain,Wallet
  - RULE-SET,binance_domain,Wallet
  - RULE-SET,okx_domain,Wallet
  - RULE-SET,usd_domain,Wallet
  - RULE-SET,steamcn_domain,DIRECT
  - RULE-SET,steam_domain,Steam
  - RULE-SET,geolocation-!cn,默认代理

  - RULE-SET,google_ip,Google
  - RULE-SET,apple_ip,Apple
  - RULE-SET,netflix_ip,NETFLIX
  - RULE-SET,telegram_ip,Telegram
  - RULE-SET,cn_ip,DIRECT

  - MATCH,漏网之鱼

# 规则集
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}

rule-providers:
  fakeip-filter: {<<: *domain, url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.mrs"}
  private_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"}
