# 虚空终端配置 by Lumine

# 锚点
as_url-test: &as_url-test {type: url-test, include-all: true, url: 'https://www.gstatic.com/generate_204', interval: 300, tolerance: 50, empty-fallback: REJECT, hidden: true, lazy: true}

as_default: &as_default [日本节点, 狮城节点, 美国节点, 台湾节点, 香港节点, 全球手动, DIRECT]
as_auto: &as_auto [默认代理, 日本节点, 狮城节点, 美国节点, 台湾节点, 香港节点, 全球手动, DIRECT]
as_select: &as_select [全球手动, 默认代理, 日本节点, 狮城节点, 美国节点, 台湾节点, 香港节点, DIRECT]
as_media: &as_media [狮城节点, 默认代理, 日本节点, 美国节点, 台湾节点, 香港节点, 全球手动, DIRECT]

# 代理订阅
# 请将下方的ProviderURL替换为自己的订阅链接
proxy-providers:
  provider1:
    url: "ProviderURL"
    type: http
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
    filter: "^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))"

# 自定义代理节点
# proxies:
#   - name: "ss1"
#     type: ss
#     server: server
#     port: 443
#     cipher: aes-128-gcm
#     password: password

# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 外部控制面板。跑裸核请取消注释。
# external-controller: 0.0.0.0:9090
# secret: ""
# external-ui: ui
# external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mips
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeip-filter"
    - "rule-set:private_domain"
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

# 出站策略
proxy-groups:
  - {name: 默认代理, type: select, proxies: *as_default}
  - {name: YouTube, type: select, proxies: *as_auto}
  - {name: Google, type: select, proxies: *as_auto}
  - {name: AI, type: select, proxies: *as_select}
  - {name: GitHub, type: select, proxies: *as_auto}
  - {name: OneDrive, type: select, proxies: *as_auto}
  - {name: Microsoft, type: select, proxies: *as_auto}
  - {name: Apple, type: select, proxies: *as_auto}
  - {name: Steam, type: select, proxies: *as_auto}
  - {name: TikTok, type: select, proxies: *as_select}
  - {name: Telegram, type: select, proxies: *as_select}
  - {name: NETFLIX, type: select, proxies: *as_media}
  - {name: Wallet, type: select, proxies: *as_select}
  - {name: 漏网之鱼, type: select, proxies: *as_auto}

  # 以下是地区分组。如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
  - {name: 香港节点, <<: *as_url-test, filter: "(?i)(港|hk|hongkong|hong kong)"}
  - {name: 台湾节点, <<: *as_url-test, filter: "(?i)(台|tw|taiwan)"}
  - {name: 日本节点, <<: *as_url-test, filter: "(?i)(日|jp|japan)"}
  - {name: 狮城节点, <<: *as_url-test, filter: "(?i)(新|sg|singapore)"}
  - {name: 美国节点, <<: *as_url-test, filter: "(?i)(美|us|unitedstates|united states)"}
  - {name: 全球手动, type: select, include-all: true, exclude-type: direct, empty-fallback: REJECT}

# 规则匹配
rules:
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT

  - RULE-SET,ai_domain,AI
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,github_domain,GitHub
  - RULE-SET,onedrive_domain,OneDrive
  - RULE-SET,microsoftcn_domain,DIRECT
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,apple_domain,Apple
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,paypal_domain,Wallet
  - RULE-SET,binance_domain,Wallet
  - RULE-SET,okx_domain,Wallet
  - RULE-SET,usd_domain,Wallet
  - RULE-SET,steamcn_domain,DIRECT
  - RULE-SET,steam_domain,Steam
  - RULE-SET,geolocation-!cn,默认代理
  - RULE-SET,cn_domain,DIRECT

  - RULE-SET,google_ip,Google
  - RULE-SET,apple_ip,Apple
  - RULE-SET,netflix_ip,NETFLIX
  - RULE-SET,telegram_ip,Telegram
  - RULE-SET,cn_ip,DIRECT

  - MATCH,漏网之鱼

# 规则集
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}

rule-providers:
  fakeip-filter: {<<: *domain, url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.mrs"}
